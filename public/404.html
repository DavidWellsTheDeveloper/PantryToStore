<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Pantry to Store</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --canvas: #FCF9F2;
    --forest: #2D4032;
    --clay: #D97757;
    --sand: #E8E2D2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: var(--canvas);
    color: var(--forest);
    font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 1rem;
  }
  .code {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(5rem, 18vw, 9rem);
    line-height: 1;
    color: var(--clay);
    letter-spacing: 0.02em;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: clamp(1.35rem, 4vw, 1.6rem);
  }
  p { max-width: 30rem; line-height: 1.5; color: var(--forest); }
  a.btn {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.65rem 1.4rem;
    border-radius: 0.5rem;
    background: var(--clay);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }
  a.btn:hover { filter: brightness(0.96); }
  a.link { color: var(--forest); text-decoration: underline; text-underline-offset: 3px; }
  .row { display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>This page wandered off.</h1>
  <p>The recipe you were looking for is not here — it may have been plated, boxed, or never written down.</p>
  <div class="row">
    <a class="btn" href="/">Back to the pantry</a>
    <a class="link" href="/search">Find a recipe</a>
  </div>
</body>
</html>
