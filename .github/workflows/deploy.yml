name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'app/**'
      - 'public/**'
      - 'server/**'
      - 'supabase/**'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}
  schedule:
    # Nightly content refresh: preregenerate seeded recipe pages + sitemap/JSON-LD.
    - cron: '0 4 * * *'

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NUXT_PUBLIC_SITE_URL: https://pantrytostore.com
  NUXT_PUBLIC_API_BASE: https://api.pantrytostore.com

jobs:
  build:
    name: Typecheck & generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate static site (prerenders recipe pages, sitemap, robots)
        run: npm run generate
        env:
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload static site artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: .output/public
          if-no-files-found: error

  deploy-static:
    name: Deploy static site (S3 + CloudFront)
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - name: Download static site
        uses: actions/download-artifact@v8
        with:
          name: static-site
          path: .output/public

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Three disjoint groups so each object's Cache-Control is decided by its
      # type, not by which sync happened to run last. Every group pairs
      # --exclude "*" with its own --include list, which is what scopes
      # --delete to that group: excluded keys are never deletion candidates.
      #
      # The trailing --exclude "_nuxt/*" on the revalidate group must stay
      # after the --include flags. aws s3 filter rules are evaluated in
      # command-line order and the last matching rule wins, so putting it
      # first would let "*.json" re-include _nuxt/builds/latest.json and
      # _nuxt/builds/meta/*.json and overwrite their immutable headers.
      - name: Sync hashed build assets to S3
        run: |
          aws s3 sync .output/public s3://${{ vars.AWS_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" \
            --include "_nuxt/*"

      - name: Sync unhashed static files to S3
        run: |
          aws s3 sync .output/public s3://${{ vars.AWS_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=86400" \
            --exclude "*" \
            --include "brand/*" \
            --include "__sitemap__/*" \
            --include "*.png" \
            --include "*.svg" \
            --include "*.ico"

      - name: Sync HTML/XML/JSON with no-cache
        run: |
          aws s3 sync .output/public s3://${{ vars.AWS_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.json" \
            --include "robots.txt" \
            --exclude "_nuxt/*"

      # aws s3 sync skips files that are already byte-identical, so on the
      # first run after this policy was introduced the assets deployed by the
      # old bare `--delete` sync kept their original (missing) Cache-Control.
      # REPLACE forces the headers onto objects that already exist. Costs one
      # re-upload of ~11 small static files once; no-op on later runs.
      - name: Backfill Cache-Control on existing static files
        run: |
          aws s3 cp .output/public s3://${{ vars.AWS_BUCKET }}/ --recursive \
            --cache-control "public, max-age=86400" \
            --metadata-directive REPLACE \
            --exclude "*" \
            --include "brand/*" \
            --include "__sitemap__/*" \
            --include "*.png" \
            --include "*.svg" \
            --include "*.ico"

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
          --paths '/*'

  deploy-lambda:
    name: Deploy Spoonacular proxy (Lambda)
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Lambda bundle (Nitro aws-lambda preset)
        run: npm run build:lambda

      - name: Package
        run: |
          cd .output/server
          zip -r9 "$GITHUB_WORKSPACE/lambda.zip" .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        run: >-
          aws lambda update-function-code
          --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}
          --zip-file fileb://lambda.zip

      - name: Ensure SPOONACULAR_API_KEY env
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(aws lambda get-function-configuration \
              --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
              --query "LastUpdateStatus" --output text)
            [ "$status" != "InProgress" ] && break
            sleep 5
          done
          aws lambda update-function-configuration \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
            --environment \
            "Variables={SPOONACULAR_API_KEY=${{ secrets.SPOONACULAR_API_KEY }}}"