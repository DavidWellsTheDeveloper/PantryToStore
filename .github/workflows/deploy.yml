name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'app/**'
      - 'public/**'
      - 'server/**'
      - 'supabase/**'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}
  schedule:
    # Nightly content refresh: preregenerate seeded recipe pages + sitemap/JSON-LD.
    - cron: '0 4 * * *'

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NUXT_PUBLIC_SITE_URL: https://pantrytostore.com
  NUXT_PUBLIC_API_BASE: https://api.pantrytostore.com

jobs:
  build:
    name: Typecheck & generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate static site (prerenders recipe pages, sitemap, robots)
        run: npm run generate
        env:
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public
          if-no-files-found: error

  deploy-static:
    name: Deploy static site (S3 + CloudFront)
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync .output/public s3://${{ vars.AWS_BUCKET }}/ --delete

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
          --paths '/*'

  deploy-lambda:
    name: Deploy Spoonacular proxy (Lambda)
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Lambda bundle (Nitro aws-lambda preset)
        run: npm run build:lambda

      - name: Package
        run: |
          cd .output/server
          zip -r9 "$GITHUB_WORKSPACE/lambda.zip" .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        run: >-
          aws lambda update-function-code
          --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}
          --zip-file fileb://lambda.zip

      - name: Ensure SPOONACULAR_API_KEY env
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(aws lambda get-function-configuration \
              --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
              --query "LastUpdateStatus" --output text)
            [ "$status" != "InProgress" ] && break
            sleep 5
          done
          aws lambda update-function-configuration \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
            --environment \
            "Variables={SPOONACULAR_API_KEY=${{ secrets.SPOONACULAR_API_KEY }}}"